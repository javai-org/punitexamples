# The shopping basket as the declarative newcomer path: the same
# scenario the full-API examples exercise, stated as a contract file —
# and the service it names is itself declared in mavai-services.yaml
# (a language-model type with an exploration and an optimization), so
# the whole example is two YAML files and a one-line test. The file
# carries the claim; the invocation carries the budget.
format: mavai-contract/1
contract: shopping-basket-builds-valid-actions
service: basket-model

transforms:
  actions: json

criteria:
  - name: responses-are-valid-action-json
    threshold: 0.9
    parses: actions
    postconditions:
      - path: "$.actions[*].context"
        equals: "SHOP"
      - path: "$.actions[*].name"
        one-of: ["add", "remove", "clear"]

inputs:
  - "Add 2 apples"
  - "Remove the milk"
  - "Add 3 oranges and 2 bananas"
  - "Clear the basket"

# The pure-services variant of the declarative example: the service is
# a language model declared in mavai-services.yaml — no bindings class
# at all. Compare shopping-basket.yaml, whose service is a one-method
# code binding.
format: mavai-contract/1
contract: shopping-basket-service-builds-valid-actions
service: basket-model

transforms:
  actions: json

criteria:
  - name: responses-are-valid-action-json
    threshold: 0.9
    parses: actions
    postconditions:
      - in: actions
        path: "$.actions[*].context"
        equals: "SHOP"
      - in: actions
        path: "$.actions[*].name"
        one-of: ["add", "remove", "clear"]

inputs:
  - "Add 2 apples"
  - "Remove the milk"
  - "Clear the basket"
